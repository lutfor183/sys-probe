name: service probe
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [probe]
  workflow_dispatch:
    inputs:
      test:
        description: "Send test message (true/false)"
        required: false
        default: "false"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pycryptodome
      # 3 passes ~90s apart per run: effective ~90s granularity even though
      # GitHub schedule fires every ~5-10 min (Actions minimum is 5 min,
      # plus queue delay — */2 in cron does NOT actually run every 2 min).
      - run: |
          for i in 1 2 3; do
            echo "=== pass $i ==="
            python3 sys-probe/probe.py || true
            if [ "$i" -lt 3 ] && [ "${{ inputs.test }}" != "true" ]; then
              sleep 90
            fi
          done
        env:
          PROBE_KEY: ${{ secrets.PROBE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PROBE_TEST: ${{ inputs.test == 'true' && '1' || '' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f sys-probe/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "probe state update"
          git fetch origin
          git rebase origin/main || (git rebase --abort; git reset --hard origin/main)
          git push
