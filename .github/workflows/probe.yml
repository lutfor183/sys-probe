name: service probe
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [probe]
  workflow_dispatch:
    inputs:
      test:
        description: "Send test message (true/false)"
        required: false
        default: "false"
permissions:
  contents: write
# Serial runs only: overlapping runs race on state.json and double-send TG alerts.
concurrency:
  group: probe-single
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q pycryptodome
      # 6 passes ~45-60s apart per run (fetches are parallel inside probe.py).
      # Covers the full 5-min schedule window, so worst-case gap stays ~5 min
      # instead of ~10. GitHub schedule minimum is 5 min + queue — cron alone
      # can NEVER go faster; for <2 min add an external pinger hitting the
      # `probe` repository_dispatch event (starts immediately, no queue).
      - run: |
          for i in 1 2 3 4 5 6; do
            echo "=== pass $i ==="
            python3 sys-probe/probe.py || true
            if [ "$i" -lt 6 ] && [ "${{ inputs.test }}" != "true" ]; then
              sleep 45
            fi
          done
        env:
          PROBE_KEY: ${{ secrets.PROBE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PROBE_TEST: ${{ inputs.test == 'true' && '1' || '' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f sys-probe/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "probe state update"
          git fetch origin
          git rebase origin/main || (git rebase --abort; git reset --hard origin/main)
          git push
